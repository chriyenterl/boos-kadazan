<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boos Kadazan</title>
<meta name="description" content="Bite-size lessons in Coastal Kadazan (Boos Kadazan), the language of Penampang and Papar in Sabah, Malaysia.">
<meta name="theme-color" content="#221F2C">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20width%3D%2240%22%20height%3D%2240%22%20rx%3D%2211%22%20fill%3D%22%23C8962C%22/%3E%3Cpath%20d%3D%22M20%206%2034%2020%2020%2034%206%2020z%22%20fill%3D%22%23221F2C%22/%3E%3Cpath%20d%3D%22M20%2013l7%207-7%207-7-7z%22%20fill%3D%22%23C8962C%22/%3E%3Cpath%20d%3D%22M20%2017.5l2.5%202.5-2.5%202.5-2.5-2.5z%22%20fill%3D%22%23B7372B%22/%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centred column. The course is a winding path of lesson stones down the page, each unit opened by a velvet-and-brass band like the hem of a sinuangga. A lesson takes over the screen in three bands: progress, exercise, answer bar. */
:root{
  --bg:#F1F3EC;          /* pale paddy */
  --surface:#FFFFFF;
  --sunk:#E6EAE0;
  --ink:#1D1B26;         /* velvet black, violet-biased */
  --muted:#5B5F55;
  --line:#D3D9CB;
  --velvet:#221F2C;      /* sinuangga velvet */
  --velvet-ink:#F4EFE1;
  --velvet-muted:#B9B3A3;
  --gold:#C8962C;        /* himpogot brass */
  --gold-deep:#94701F;
  --gold-soft:#F4E6C2;
  --on-gold:#1D1B26;
  --bead:#B7372B;        /* bead red */
  --ok:#3C7529; --ok-deep:#2A5A1B; --ok-soft:#DDEDD1; --on-ok:#FFFFFF;
  --bad:#B4382C; --bad-deep:#86271E; --bad-soft:#F7DFDA; --on-bad:#FFFFFF;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --fs-xs:.78rem; --fs-s:.9rem; --fs-m:1rem; --fs-l:1.2rem; --fs-xl:1.55rem; --fs-2xl:2.1rem; --fs-3xl:2.9rem;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14131A; --surface:#1E1C26; --sunk:#272430; --ink:#EEEBE2; --muted:#A5A398; --line:#37333F;
    --velvet:#0C0B11; --velvet-ink:#F4EFE1; --velvet-muted:#A9A393;
    --gold:#DDB04A; --gold-deep:#9E7720; --gold-soft:#3A3020; --on-gold:#1A1820;
    --bead:#D9584A;
    --ok:#8DC266; --ok-deep:#5B8C3A; --ok-soft:#1F2D1A; --on-ok:#14131A;
    --bad:#EE7A6C; --bad-deep:#B4473B; --bad-soft:#37201E; --on-bad:#14131A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14131A; --surface:#1E1C26; --sunk:#272430; --ink:#EEEBE2; --muted:#A5A398; --line:#37333F;
  --velvet:#0C0B11; --velvet-ink:#F4EFE1; --velvet-muted:#A9A393;
  --gold:#DDB04A; --gold-deep:#9E7720; --gold-soft:#3A3020; --on-gold:#1A1820;
  --bead:#D9584A;
  --ok:#8DC266; --ok-deep:#5B8C3A; --ok-soft:#1F2D1A; --on-ok:#14131A;
  --bad:#EE7A6C; --bad-deep:#B4473B; --bad-soft:#37201E; --on-bad:#14131A;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 var(--fs-m)/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- Woven band (beadwork zigzag) ---------- */
.weave{
  height:12px;
  background-color:var(--velvet);
  background-image:
    linear-gradient(135deg,var(--gold) 25%,transparent 25%),
    linear-gradient(225deg,var(--gold) 25%,transparent 25%),
    linear-gradient(315deg,var(--bead) 25%,transparent 25%),
    linear-gradient(45deg,var(--bead) 25%,transparent 25%);
  background-size:12px 12px;
  background-position:-6px 0,-6px 0,0 0,0 0;
}
.weave.thin{height:8px;background-size:8px 8px;background-position:-4px 0,-4px 0,0 0,0 0}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  border:0;border-radius:14px;padding:.7rem 1.15rem;cursor:pointer;
  font:700 var(--fs-s)/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;
  transition:transform .08s ease, box-shadow .08s ease, background-color .15s ease;
}
.btn:disabled{cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--on-gold);box-shadow:0 4px 0 var(--gold-deep)}
.btn-ok{background:var(--ok);color:var(--on-ok);box-shadow:0 4px 0 var(--ok-deep)}
.btn-bad{background:var(--bad);color:var(--on-bad);box-shadow:0 4px 0 var(--bad-deep)}
.btn-ghost{background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line)}
.btn-band{background:transparent;color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;padding:.55rem .9rem;font-size:var(--fs-xs)}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn-ok:not(:disabled):active{box-shadow:0 1px 0 var(--ok-deep)}
.btn-bad:not(:disabled):active{box-shadow:0 1px 0 var(--bad-deep)}
.btn-ghost:not(:disabled):active{box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.btn-band:not(:disabled):active{box-shadow:0 0 0 2px var(--gold) inset}
.btn:disabled.btn-gold{background:var(--sunk);color:var(--muted);box-shadow:0 4px 0 var(--line)}
.btn-big{padding:1rem 1.5rem;font-size:var(--fs-m);min-width:10rem}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:.4rem;border-radius:10px;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn svg{width:26px;height:26px}
.linkish{border:0;background:none;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--ink);font-weight:600}

/* ---------- Masthead ---------- */
.mast{background:var(--velvet);color:var(--velvet-ink)}
.mast-in{max-width:40rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:1.1rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.75rem;min-width:0}
.mark{width:40px;height:40px;flex:none}
/* Symbol parts are styled on the originals so the colours carry into every <use> copy */
.m-gold{fill:var(--gold)} .m-vel{fill:var(--velvet)} .m-bead{fill:var(--bead)} .gem-in{fill:var(--gold-soft)}
.brand-name{font:800 var(--fs-xl)/1 var(--font-display);letter-spacing:-.01em}
.brand-sub{font-size:var(--fs-xs);color:var(--velvet-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:.3rem}
.stats{display:flex;gap:.5rem}
.stat{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .7rem;border-radius:999px;background:rgba(255,255,255,.07);font-weight:700;font-variant-numeric:tabular-nums}
.stat svg{width:18px;height:18px}
.stat .i-flame{fill:var(--bead)} .stat .i-bolt{fill:var(--gold)}
.stat.cold .i-flame{fill:var(--velvet-muted)}

/* ---------- Page column ---------- */
.page{max-width:40rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:1.25rem 3rem;display:grid;gap:1.5rem}

.today{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.ring{width:56px;height:56px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .ring-bg{stroke:var(--sunk)}
.ring .ring-fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.today-text{flex:1 1 9rem;min-width:0}
.today-title{font:700 var(--fs-l)/1.2 var(--font-display)}
.today-sub{color:var(--muted);font-size:var(--fs-s);font-variant-numeric:tabular-nums}
.today-actions{display:flex;gap:.6rem;flex-wrap:wrap}

/* ---------- Units & path ---------- */
.unit{display:grid;gap:1.5rem}
.unit-band{background:var(--velvet);color:var(--velvet-ink);border-radius:18px;overflow:hidden}
.unit-band-in{padding:1rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--velvet-muted);font-variant-numeric:tabular-nums}
.unit-kz{font:800 var(--fs-xl)/1.1 var(--font-display);color:var(--gold);margin-top:.2rem}
.unit-en{font-weight:600;margin-top:.15rem}
.nodes{list-style:none;margin:0;padding:.75rem 0 .5rem;display:grid;gap:1.6rem;justify-items:center}
.node-li{position:relative;display:flex;flex-direction:column;align-items:center;gap:.45rem;transform:translateX(calc(var(--x) * 46px))}
.node{width:72px;height:66px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;transition:transform .08s ease, box-shadow .08s ease}
.node svg{width:30px;height:30px}
.node.done{background:var(--gold);color:var(--on-gold);box-shadow:0 7px 0 var(--gold-deep)}
.node.current{background:var(--gold);color:var(--on-gold);box-shadow:0 7px 0 var(--gold-deep),0 0 0 7px var(--bg),0 0 0 11px var(--gold-soft)}
.node.locked{background:var(--sunk);color:var(--muted);box-shadow:0 7px 0 var(--line)}
.node:active{transform:translateY(5px)}
.node.done:active,.node.current:active{box-shadow:0 2px 0 var(--gold-deep)}
.node.locked:active{box-shadow:0 2px 0 var(--line)}
.node-name{font-size:var(--fs-s);font-weight:600;color:var(--muted);text-align:center;max-width:9rem;line-height:1.25}
.node-li.is-current .node-name{color:var(--ink)}
.bubble{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--surface);color:var(--gold-deep);border:2px solid var(--line);border-radius:10px;padding:.3rem .7rem;font:800 var(--fs-xs)/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
:root[data-theme="dark"] .bubble{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble{color:var(--gold)}}
.bubble::after{content:"";position:absolute;top:100%;left:50%;width:10px;height:10px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-5px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}

.foot{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;color:var(--muted);font-size:var(--fs-s);border-top:2px solid var(--line);padding-top:1rem}

/* ---------- Lesson ---------- */
.lesson{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto 1fr auto}
.l-top{padding-top:env(safe-area-inset-top,0px)}
.l-top-in{max-width:44rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:.9rem .4rem;display:flex;align-items:center;gap:.75rem}
.bar{flex:1;height:16px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:999px;background:var(--gold);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);transition:width .35s ease}
.l-body{overflow-y:auto;overscroll-behavior:contain}
.l-body-in{max-width:40rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:1.5rem 2rem;display:grid;gap:1.25rem;align-content:start;min-height:100%}
.ex-label{margin:0;font:800 var(--fs-xl)/1.15 var(--font-display);text-wrap:balance}
.pill{justify-self:start;font-size:var(--fs-xs);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:.35rem .7rem}
:root[data-theme="dark"] .pill{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:var(--gold)}}
.say{display:flex;align-items:flex-start;gap:.9rem}
.say-mark{width:42px;height:42px;flex:none;margin-top:.2rem}
.say-bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:.75rem 1rem;background:var(--surface);min-width:0}
.say-kz{font:700 var(--fs-2xl)/1.2 var(--font-display);overflow-wrap:anywhere}
.say-en{font:700 var(--fs-xl)/1.3 var(--font-body)}
.w{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted var(--muted);text-decoration-thickness:2px;text-underline-offset:.22em}
.w:hover,.w:focus-visible{color:var(--gold-deep)}
:root[data-theme="dark"] .w:hover{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .w:hover{color:var(--gold)}}
.intro-en{font:600 var(--fs-l)/1.4 var(--font-body);margin:0}
.intro-note{margin:0;color:var(--muted);max-width:36rem}
.dusun{justify-self:start;display:inline-flex;gap:.5rem;align-items:baseline;border:2px dashed var(--line);border-radius:12px;padding:.45rem .75rem;font-size:var(--fs-s)}
.dusun b{font-family:var(--font-display);font-size:var(--fs-m)}
.hint{margin:0;color:var(--muted);font-size:var(--fs-s)}

.opts{display:grid;gap:.7rem}
.opt{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.85rem 1rem;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);cursor:pointer;font:600 var(--fs-m)/1.35 var(--font-body);transition:background-color .12s ease,border-color .12s ease}
.opt:hover:not(:disabled){background:var(--sunk)}
.opt.kz{font:700 var(--fs-l)/1.3 var(--font-display)}
.opt .key{flex:none;width:1.65rem;height:1.65rem;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:700 var(--fs-xs)/1 var(--font-body);color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.opt[aria-pressed="true"] .key{border-color:var(--gold);color:var(--ink)}
.opt.is-right{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.zone{min-height:7.5rem;display:flex;flex-wrap:wrap;align-content:flex-start;gap:.5rem;padding:.5rem 0;
  background-image:linear-gradient(to bottom,transparent calc(3.6rem - 2px),var(--line) calc(3.6rem - 2px),var(--line) 3.6rem,transparent 3.6rem);
  background-size:100% 3.6rem}
.bank{display:flex;flex-wrap:wrap;justify-content:center;gap:.55rem;padding-top:.5rem}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:var(--surface);padding:.55rem .8rem;cursor:pointer;font:700 var(--fs-l)/1.1 var(--font-display);min-height:2.9rem}
.tile:hover:not(:disabled){background:var(--sunk)}
.tile.used{background:var(--sunk);color:transparent;border-color:var(--sunk);cursor:default}
.tile:disabled{cursor:default}

.type-wrap{display:flex;gap:.5rem;align-items:stretch}
.type-in{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:.9rem 1rem;font:700 var(--fs-l)/1.2 var(--font-display)}
.type-in:focus{outline:none;border-color:var(--gold)}
.type-in:disabled{opacity:.85}
.glot{flex:none;width:3.4rem;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:var(--surface);cursor:pointer;font:800 1.6rem/1 var(--font-display)}
.glot:hover:not(:disabled){background:var(--sunk)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.mcol{display:grid;gap:.6rem;align-content:start;min-width:0}
.mbtn{width:100%;min-height:3.4rem;border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;background:var(--surface);cursor:pointer;padding:.55rem .7rem;font:600 var(--fs-s)/1.25 var(--font-body);overflow-wrap:anywhere;transition:background-color .12s ease,border-color .12s ease,opacity .3s ease}
.mbtn.kz{font:700 var(--fs-m)/1.2 var(--font-display)}
.mbtn:hover:not(:disabled){background:var(--sunk)}
.mbtn[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.mbtn.flash{border-color:var(--bad);background:var(--bad-soft)}
.mbtn.matched{border-color:var(--ok);background:var(--ok-soft);opacity:.45;cursor:default}

.l-foot{border-top:2px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px);transition:background-color .2s ease}
.l-foot[data-state="ok"]{background:var(--ok-soft);border-top-color:var(--ok-soft)}
.l-foot[data-state="bad"]{background:var(--bad-soft);border-top-color:var(--bad-soft)}
.l-foot-in{max-width:44rem;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:1rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:.9rem 1.25rem;flex-wrap:wrap}
.fb{flex:1 1 16rem;min-width:0;display:flex;gap:.8rem;align-items:center}
.fb:empty{display:none}
.fb-icon{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center}
.fb-icon svg{width:22px;height:22px}
.l-foot[data-state="ok"] .fb-icon{background:var(--ok);color:var(--on-ok)}
.l-foot[data-state="bad"] .fb-icon{background:var(--bad);color:var(--on-bad)}
.fb-title{font:800 var(--fs-l)/1.2 var(--font-display)}
.l-foot[data-state="ok"] .fb-title,.l-foot[data-state="ok"] .fb-detail{color:var(--ok-deep)}
.l-foot[data-state="bad"] .fb-title,.l-foot[data-state="bad"] .fb-detail{color:var(--bad-deep)}
:root[data-theme="dark"] .l-foot[data-state="ok"] .fb-title,:root[data-theme="dark"] .l-foot[data-state="ok"] .fb-detail{color:var(--ok)}
:root[data-theme="dark"] .l-foot[data-state="bad"] .fb-title,:root[data-theme="dark"] .l-foot[data-state="bad"] .fb-detail{color:var(--bad)}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .l-foot[data-state="ok"] .fb-title,:root:not([data-theme="light"]) .l-foot[data-state="ok"] .fb-detail{color:var(--ok)}
  :root:not([data-theme="light"]) .l-foot[data-state="bad"] .fb-title,:root:not([data-theme="light"]) .l-foot[data-state="bad"] .fb-detail{color:var(--bad)}
}
.fb-detail{font-size:var(--fs-s);font-weight:600;overflow-wrap:anywhere}
.fb-detail .kz{font-family:var(--font-display);font-weight:700;font-size:var(--fs-m)}
.l-foot-in .btn-big{margin-left:auto}

.done-wrap{display:grid;justify-items:center;text-align:center;gap:1rem;padding-top:1.5rem}
.done-mark{width:96px;height:96px}
.done-kz{margin:0;font:800 var(--fs-3xl)/1 var(--font-display);color:var(--gold-deep);letter-spacing:-.01em}
:root[data-theme="dark"] .done-kz{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done-kz{color:var(--gold)}}
.done-en{margin:0;color:var(--muted);max-width:28rem}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;width:100%;max-width:26rem}
.trio div{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.trio span{display:block}
.trio .t-l{font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.35rem .25rem;background:var(--gold);color:var(--on-gold)}
.trio .t-v{font:800 var(--fs-xl)/1 var(--font-display);padding:.8rem .25rem;font-variant-numeric:tabular-nums}
.streak-up{margin:0;font-weight:700;display:inline-flex;gap:.4rem;align-items:center}
.streak-up svg{width:20px;height:20px;fill:var(--bead)}

/* ---------- Sheets, tooltip, toast ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:grid;align-items:end;justify-items:center}
.sheet-back{position:absolute;inset:0;background:rgba(12,11,17,.55)}
.sheet-panel{position:relative;width:100%;max-width:38rem;max-height:88vh;display:grid;grid-template-rows:auto 1fr;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:640px){.sheet{align-items:center}.sheet-panel{border-radius:20px;max-height:84vh}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1rem .5rem 1.25rem;border-bottom:2px solid var(--line)}
.sheet-head h2{font:800 var(--fs-xl)/1.15 var(--font-display)}
.sheet-body{overflow-y:auto;padding:1rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));display:grid;gap:1rem;align-content:start}
.sheet-body p{margin:0;max-width:62ch}
.sheet-body h3{font:700 var(--fs-l)/1.2 var(--font-display);margin-top:.5rem}
.vocab{width:100%;border-collapse:collapse}
.vocab td{padding:.6rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.vocab td:first-child{font:700 var(--fs-m)/1.3 var(--font-display);width:45%;padding-left:0}
.vocab .v-note{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:.15rem}
.vocab tr.lesson-row td{border-bottom:0;padding-top:1rem;font:800 var(--fs-xs)/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sounds{display:grid;gap:.75rem}
.snd{display:grid;grid-template-columns:4.2rem 1fr;gap:.9rem;align-items:start;padding-bottom:.75rem;border-bottom:1px solid var(--line)}
.snd-k{font:800 var(--fs-xl)/1 var(--font-display);color:var(--gold-deep);text-align:center;background:var(--gold-soft);border-radius:12px;padding:.6rem 0}
:root[data-theme="dark"] .snd-k{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .snd-k{color:var(--gold)}}
.snd p{margin:0}
.snd .ex{font-family:var(--font-display);font-weight:700}
.src{margin:0;padding-left:1.1rem;display:grid;gap:.5rem}
.src a{font-weight:600}
.sheet-actions{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:flex-end;padding-top:.5rem}
.tip{position:fixed;z-index:70;max-width:min(16rem,calc(100vw - 32px));background:var(--velvet);color:var(--velvet-ink);border-radius:10px;padding:.45rem .7rem;font-size:var(--fs-s);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 32px);background:var(--velvet);color:var(--velvet-ink);border-radius:12px;padding:.7rem 1rem;font-weight:600;font-size:var(--fs-s);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}

/* ---------- Friends ---------- */
.friends{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:1rem;display:grid;gap:.85rem}
.fr-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.fr-title{font:700 var(--fs-l)/1.2 var(--font-display)}
.fr-sub{color:var(--muted);font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase}
.board{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.board li{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto auto;gap:.6rem;align-items:center;padding:.55rem .65rem;border-radius:12px;background:var(--sunk)}
.board li.me{background:var(--gold-soft)}
.board .rk{font:800 var(--fs-s)/1 var(--font-display);text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.board .nm{min-width:0;font-weight:700;line-height:1.25}
.board .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{display:block;font-weight:500;color:var(--muted);font-size:var(--fs-xs)}
.board .st{display:inline-flex;align-items:center;gap:.2rem;font-weight:700;font-size:var(--fs-s);font-variant-numeric:tabular-nums}
.board .st svg{width:15px;height:15px;fill:var(--bead)}
.board .st.cold svg{fill:var(--muted)}
.board .wx{font:800 var(--fs-s)/1 var(--font-display);font-variant-numeric:tabular-nums;min-width:3.8rem;text-align:right}
.fr-actions{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.code-chip{font:800 var(--fs-m)/1 var(--font-display);letter-spacing:.14em;background:var(--velvet);color:var(--gold);padding:.55rem .75rem;border-radius:10px;font-variant-numeric:tabular-nums}
.fr-note{margin:0;color:var(--muted);font-size:var(--fs-s)}
.row-form{display:flex;gap:.5rem;flex-wrap:wrap;align-items:stretch}
.row-form .text-in{flex:1 1 10rem}
.text-in{min-width:0;width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:.7rem .8rem;font:600 var(--fs-m)/1.2 var(--font-body)}
.text-in:focus{outline:none;border-color:var(--gold)}
.text-in.code{font-family:var(--font-display);letter-spacing:.14em;text-transform:uppercase}
.err{margin:0;color:var(--bad);font-weight:600;font-size:var(--fs-s)}
.btn-sm{padding:.55rem .85rem;font-size:var(--fs-xs)}
.manage-list{list-style:none;margin:0;padding:0;display:grid}
.manage-list li{display:flex;justify-content:space-between;align-items:center;gap:.75rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.manage-list li > span{min-width:0;overflow-wrap:anywhere}

/* ---------- Read-aloud buttons ---------- */
.say-row{display:flex;align-items:center;gap:.6rem .9rem;flex-wrap:wrap}
.say-btns{display:inline-flex;gap:.45rem;align-items:center}
.spk{flex:none;width:2.6rem;height:2.6rem;border-radius:12px;border:0;cursor:pointer;display:grid;place-items:center;background:var(--gold);color:var(--on-gold);box-shadow:0 3px 0 var(--gold-deep);transition:transform .08s ease,box-shadow .08s ease}
.spk svg{width:20px;height:20px}
.spk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold-deep)}
.spk.slow{width:auto;padding:0 .7rem;background:var(--surface);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);font:800 var(--fs-xs)/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.spk.slow:active{box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.spk.mini{width:1.9rem;height:1.9rem;border-radius:9px;box-shadow:0 2px 0 var(--gold-deep)}
.spk.mini svg{width:14px;height:14px}
.v-kz-row{display:flex;align-items:center;justify-content:space-between;gap:.5rem}
body.no-voice .spk,body.no-voice .needs-voice{display:none!important}
.fb-hint{color:var(--muted);font-weight:600;font-size:var(--fs-s)}
.toggle{display:flex;align-items:center;gap:.7rem;font-weight:600;cursor:pointer}
.toggle input{width:1.25rem;height:1.25rem;accent-color:var(--gold);margin:0;flex:none}
.voice-note{color:var(--muted);font-size:var(--fs-s)}

@media (max-width:560px){
  .say-kz{font-size:var(--fs-xl)}
  .l-foot-in .btn-big{flex:1 1 100%;margin-left:0}
  .unit-band-in{align-items:flex-start}
  .trio .t-v{font-size:var(--fs-l)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
body.locked{overflow:hidden}
</style>

<header class="mast">
  <div class="mast-in">
    <div class="brand">
      <svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg>

<script>
(function () {
'use strict';

/* =====================================================================
   COURSE CONTENT
   Coastal Kadazan (Boos Kadazan) of Penampang, Papar and Membakut.
   Phrases and numbers: Omniglot's Coastal Kadazan pages (contributed by
   Lesley Housten C Kibat and Dr Francis Paul). Family words: Omniglot's
   Kadazandusun family list. Kadazan/Dusun word pairs: Wikipedia.
   ===================================================================== */
function U(id, kz, en, tip, lessons) { return { id: id, kz: kz, en: en, tip: tip, lessons: lessons }; }
function L(id, name, rows) {
  return { id: id, name: name, items: rows.map(function (r, i) {
    var it = { id: id + '-' + (i + 1), kz: r[0], en: r[1] };
    var o = r[2] || {};
    if (o.alt) it.alt = o.alt;
    if (o.note) it.note = o.note;
    if (o.dusun) it.dusun = o.dusun;
    return it;
  }) };
}

var COURSE = [
  U('greet', 'Kopivosian', 'Greetings',
    'Kopivosian is the everyday greeting. Add a time of day to make it more specific, and answer kotohuadan (thank you) with miagal.', [
    L('greet-1', 'Hello & thanks', [
      ['Kopivosian', 'hello', { note: 'The all-purpose greeting, for any time of day.' }],
      ['Kotohuadan', 'thank you'],
      ['Miagal', "you're welcome", { note: 'The reply to kotohuadan. You will also hear miagal nopo.', alt: ['Miagal nopo'] }],
      ['Siou', 'sorry · excuse me', { note: 'Also siou no.', alt: ['Siou no'] }]
    ]),
    L('greet-2', 'Times of day', [
      ['Kopivosian doungosuvab', 'good morning'],
      ['Kopivosian doungadau', 'good afternoon'],
      ['Kopivosian minsosodopon', 'good evening'],
      ['Kopivosian doungotuvong', 'good night'],
      ['Tumoodo no', 'goodbye']
    ]),
    L('greet-3', 'How are you?', [
      ['Kopivosian do kinoikatan', 'welcome'],
      ['Onu abal nu?', 'how are you?', { note: 'Ingkuo ko no? also means how are you?', alt: ['Ingkuo ko no?'] }],
      ['Noikot vinasi, om iziau?', "I'm fine, and you?", { note: 'The usual reply to Onu abal nu?' }],
      ['Ahaid kito au nokopisohovot', 'long time no see']
    ])
  ]),
  U('intro', 'Ngaan', 'Introductions',
    'Zou means I and ko means you. These short words usually come second in the sentence: Kalati zou (I understand), Au zou kalati (I don’t understand).', [
    L('intro-1', 'Names', [
      ['ngaan', 'name'],
      ['Iisai ngaan nu?', "what's your name?"],
      ['Ngaan ku zi Ana', 'my name is Ana', { note: 'Swap in your own name. A longer way to say it: Ngaan ku nopo nga zi …' }],
      ['Tabi pintutunan kumaa diau', 'pleased to meet you']
    ]),
    L('intro-2', 'Where from', [
      ['zou', 'I · me'],
      ['ko', 'you'],
      ['Nomboo o nontodonon nu?', 'where are you from?'],
      ['Mantad zou doiho Penampang', "I'm from Penampang", { note: 'Penampang, next to Kota Kinabalu, is a Kadazan heartland. Swap in your own home town.' }]
    ]),
    L('intro-3', 'Yes & no', [
      ['oh', 'yes'],
      ['au', 'no · not', { note: 'You will also hear a’a.', alt: ['a’a'] }],
      ['kanto', 'maybe'],
      ['Au zou nokoiho', "I don't know"]
    ])
  ]),
  U('num', 'Numbul', 'Numbers',
    'Ten is opod. For 11 to 19 say “ten and …”: opod om iso’ is 11. For the tens, put a number before ngoopod: duvo ngoopod is 20. Each card shows the Central Dusun word too, so you can see how close the two are.', [
    L('num-1', '1 to 5', [
      ['iso’', 'one (1)', { dusun: 'iso' }],
      ['duvo', 'two (2)', { dusun: 'duo' }],
      ['tohu', 'three (3)', { dusun: 'tolu' }],
      ['apat', 'four (4)', { dusun: 'apat' }],
      ['himo', 'five (5)', { dusun: 'limo' }]
    ]),
    L('num-2', '6 to 10', [
      ['onom', 'six (6)', { dusun: 'onom' }],
      ['tuu’', 'seven (7)', { dusun: 'turu' }],
      ['vahu', 'eight (8)', { dusun: 'walu' }],
      ['sizam', 'nine (9)', { dusun: 'siam' }],
      ['opod', 'ten (10)', { dusun: 'hopod' }]
    ]),
    L('num-3', 'Counting up', [
      ['opod om iso’', 'eleven (11)', { note: 'Literally “ten and one”. Om means and.' }],
      ['opod om himo', 'fifteen (15)'],
      ['duvo ngoopod', 'twenty (20)', { note: 'Literally “two tens”.' }],
      ['tohu ngoopod om duvo', 'thirty-two (32)'],
      ['atus', 'one hundred (100)'],
      ['ibu', 'one thousand (1,000)', { note: 'Also soibu.', alt: ['soibu'] }]
    ])
  ]),
  U('lang', 'Boos', 'Language help',
    'Boos means language or speech, so Boos Kadazan is the Kadazan language. Small words like po make a request gentler.', [
    L('lang-1', 'Understanding', [
      ['Kalati ko?', 'do you understand?'],
      ['Kalati zou', 'I understand'],
      ['Au zou kalati', "I don't understand"],
      ['boos', 'language · speech', { note: 'Often written bo’os. Boos Kadazan is the Kadazan language.', alt: ['bo’os'] }]
    ]),
    L('lang-2', 'Asking for help', [
      ['Momboos ko do Kadazan?', 'do you speak Kadazan?'],
      ['Oh, okudi', 'yes, a little'],
      ['Posonodon gia do momoboos', 'please speak more slowly'],
      ['Poboos insan poh vagu', 'please say that again', { note: 'Insan means once and vagu means again.' }],
      ['Booso zou po boos Kadazan', 'speak to me in Kadazan']
    ])
  ]),
  U('family', 'Tama om Tina', 'Family',
    'Many family words have two forms: one for talking about someone (tama, father) and one for calling them (Ama). These words follow the standard Kadazandusun family list. Penampang Kadazan texts also write tama’ with a final glottal stop.', [
    L('family-1', 'Parents', [
      ['tama', 'father', { note: 'Call him Ama.', alt: ['tama’'] }],
      ['tina', 'mother', { note: 'Call her Ina.' }],
      ['Tama om tina', 'father and mother'],
      ['tanak', 'child']
    ]),
    L('family-2', 'Grandparents & siblings', [
      ['aki', 'grandfather', { note: 'What you call him. The plain noun is taki.' }],
      ['odu', 'grandmother', { note: 'What you call her. The plain noun is todu.' }],
      ['tadi', 'younger sibling', { note: 'Tadi kusai is a younger brother, tadi tondu a younger sister.' }],
      ['tobpinai', 'sibling']
    ]),
    L('family-3', 'Sons & daughters', [
      ['kusai', 'male · man'],
      ['tondu', 'female · woman'],
      ['tanak kusai', 'son'],
      ['tanak tondu', 'daughter'],
      ['duvo tanak kusai', 'two sons']
    ])
  ]),
  U('words', 'Tadau', 'Everyday words',
    'Compare these with Central Dusun to spot a pattern. Where Dusun has l, Coastal Kadazan often has h: tuhun and tulun (person). Where Dusun has w, Kadazan has v: vagu and wagu (new).', [
    L('words-1', 'Home', [
      ['tuhun', 'person', { dusun: 'tulun' }],
      ['hamin', 'house', { dusun: 'walai' }],
      ['tasu', 'dog', { dusun: 'tasu' }],
      ['piasau', 'coconut', { dusun: 'piasau' }],
      ['tapui', 'fire', { dusun: 'tapui' }]
    ]),
    L('words-2', 'Time', [
      ['tadau', 'day', { dusun: 'tadau' }],
      ['toun', 'year'],
      ['vagu', 'new · again', { dusun: 'wagu' }],
      ['onu', 'what', { dusun: 'onu' }],
      ['tokou', 'we (you and I)', { note: 'We, including the person you are talking to.' }],
      ['Kotobian do toun vagu', 'happy New Year']
    ])
  ]),
  U('celebrate', 'Kotobian', 'Celebrations',
    'Kotobian starts most good wishes. Kaamatan, the harvest festival, fills Sabah each May with sumazau dancing, the Unduk Ngadau pageant and the greeting Kotobian Tadau Tagazo do Kaamatan.', [
    L('celebrate-1', 'Good wishes', [
      ['Kotobian tadau kinohodian', 'happy birthday'],
      ['Kotobian tadau Krismas', 'merry Christmas'],
      ['Kounsikaan!', 'congratulations!'],
      ['Ahansan do kahantoi!', 'good luck!'],
      ['Ohingasan ko da do tosisikap', 'get well soon']
    ]),

/* =====================================================================
   FRIENDS
   Each learner may make a friend code on the Boos Kadazan friends server
   (a Cloudflare Worker). Anyone with the code can see that learner's name,
   XP, streak and lessons done; only this device's secret can change them.
   The list of friends you follow stays on this device.
   ===================================================================== */
var PROD_API = 'https://boos-kadazan-friends.gigcreatives.workers.dev';
var PUBLIC_URL = 'https://chriyenterl.github.io/boos-kadazan/';
var API = (function () {
  try { var o = localStorage.getItem('boos-kadazan-api'); if (o) return o.replace(/\/+$/, ''); } catch (e) { /* no storage */ }
  return location.hostname === 'chriyenterl.github.io' ? PROD_API : '';
})();
var CACHE_KEY = 'boos-kadazan-friends-cache';
var friendData = (function () { try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || {}; } catch (e) { return {}; } })();
var friendStatus = 'idle', friendsLoadedAt = 0;
function saveFriendCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(friendData)); } catch (e) { /* no storage */ } }

function normCode(v) { var s = String(v || '').toUpperCase().replace(/[\s-]/g, ''); return /^[2-9A-HJ-NP-Z]{6}$/.test(s) ? s : null; }
function cleanName(v) { var s = String(v || '').normalize('NFC').replace(/\s+/g, ' ').trim(); return /^[\p{L}\p{M}\p{N} .'\-_]{1,24}$/u.test(s) ? s : null; }
function apiFetch(path, opts) {
  return fetch(API + path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || 'error'); e.status = r.status; throw e; }
      return j;
    });
  });
}
function friendError(e) {
  if (e && e.status === 429) return 'Too many new friend codes from this network today. Try again tomorrow.';
  if (e && e.status === 400) return 'That name can’t be used. Use 1 to 24 letters, numbers or spaces.';
  return 'Couldn’t reach the friends server. Check your connection and try again.';
}
function progressBody() {
  return {
    name: state.me.name, xp: state.xp, streak: state.streak.n, streakLast: state.streak.last,
    lessons: Object.keys(state.done).length, weekKey: weekKey(), weekXp: weekXP()
  };
}
function pushProgress() {
  if (!API || !state.me) return Promise.resolve();
  return apiFetch('/api/learners/' + state.me.code, {
    method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.me.secret },
    body: JSON.stringify(progressBody())
  }).catch(function () { /* tried again after the next lesson */ });
}
function refreshFriends() {
  if (!API || !state.me || !state.friends.length) { renderFriends(); return; }
  var codes = state.friends.slice(0, 50);
  friendStatus = 'loading';
  apiFetch('/api/learners?codes=' + codes.join(',')).then(function (j) {
    var got = {};
    (j.learners || []).forEach(function (l) { got[l.code] = l; });
    codes.forEach(function (c) { friendData[c] = got[c] || { code: c, missing: true, name: (friendData[c] && friendData[c].name) || c }; });
    saveFriendCache();
    friendStatus = 'ok'; friendsLoadedAt = Date.now();
    renderFriends();
  }).catch(function () { friendStatus = 'error'; renderFriends(); });
}
function liveStreak(n, last) { return (last === today() || last === yesterday()) ? (n || 0) : 0; }
function friendEntry(c) {
  var d = friendData[c] || { code: c, name: c, pending: true };
  return {
    code: c, name: d.name || c, me: false, missing: !!d.missing, pending: !!d.pending,
    streak: liveStreak(d.streak, d.streakLast), xp: d.xp || 0, lessons: d.lessons || 0,
    week: d.weekKey === weekKey() ? (d.weekXp || 0) : 0
  };
}
function flame() { return '<svg aria-hidden="true"><use href="#i-flame"/></svg>'; }

function renderFriends() {
  var body = $('#fr-body'), sub = $('#fr-sub');
  if (!body) return;
  if (!API) {
    sub.textContent = '';
    body.innerHTML = '<p class="fr-note">Friends work on the public site. Open <a href="' + PUBLIC_URL + '" target="_blank" rel="noopener">chriyenterl.github.io/boos-kadazan</a> to add friends and see their progress.</p>';
    return;
  }
  if (!state.me) {
    sub.textContent = '';
    body.innerHTML = '<p class="fr-note">Learn alongside friends and see their streaks and XP. Pick a display name to get your friend code. Anyone you give the code to can see your name, XP, streak and lessons done.</p>' +
      '<form class="row-form" id="fr-setup"><label class="sr" for="fr-name">Display name</label>' +
      '<input id="fr-name" class="text-in" maxlength="24" autocomplete="nickname" placeholder="Your display name">' +
      '<button type="submit" class="btn btn-gold">Get my code</button></form><p class="err" id="fr-err" hidden></p>';
    return;
  }
  sub.textContent = 'This week’s XP';
  var total = ALL_LESSONS.length;
  var rows = [{ code: state.me.code, name: state.me.name, me: true, streak: streakNow(), xp: state.xp, lessons: Object.keys(state.done).length, week: weekXP() }]
    .concat(state.friends.map(friendEntry))
    .sort(function (a, b) { return (b.week - a.week) || (b.xp - a.xp) || (a.me ? -1 : 1); });
  var list = rows.map(function (e, i) {

    return '<li class="' + (e.me ? 'me' : '') + '"><span class="rk">' + (i + 1) + '</span>' +

      '<span class="wx">' + e.week + ' XP</span></li>';
  }).join('');
  var status = '';
  if (state.friends.length) {
    if (friendStatus === 'loading') status = 'Updating…';
    else if (friendStatus === 'error') status = 'Couldn’t update friends just now, so this shows their last known progress.';
    else if (friendsLoadedAt) status = 'Updated ' + new Date(friendsLoadedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '. ';
  }
  body.innerHTML = '<ol class="board" aria-label="This week’s XP">' + list + '</ol>' +
    (state.friends.length ? '' : '<p class="fr-note">No friends yet. Send your invite link to a friend, and add theirs with their code.</p>') +
    '<div class="fr-actions"><span class="code-chip" title="Your friend code"><span class="sr">Your friend code: </span>' + esc(state.me.code) + '</span>' +
    '<button type="button" class="btn btn-ghost btn-sm" data-fr="invite">Copy invite link</button>' +
    '<button type="button" class="btn btn-gold btn-sm" data-fr="add">Add a friend</button>' +
    '<button type="button" class="linkish" data-fr="manage">Manage</button></div>' +
    (status ? '<p class="fr-note">' + status + (friendStatus !== 'loading' ? '<button type="button" class="linkish" data-fr="refresh">Refresh</button>' : '') + '</p>' : '');
}

function createProfile(name, btn) {
  var err = $('#fr-err'), n = cleanName(name);
  err.hidden = true;
  if (!n) { err.textContent = 'Pick a name with 1 to 24 letters, numbers or spaces.'; err.hidden = false; return; }
  btn.disabled = true;
  apiFetch('/api/learners', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: n }) })
    .then(function (j) {
      state.me = { code: j.code, secret: j.secret, name: j.name };
      save();
      pushProgress();
      renderFriends();
      refreshFriends();
      toast('Your friend code is ' + j.code + '.');
    })
    .catch(function (e) { btn.disabled = false; err.textContent = friendError(e); err.hidden = false; });

function openAddFriend() {
  openSheet('Add a friend', '<p>Ask your friend for their 6-character friend code, or open the invite link they send you.</p>' +
    '<form class="row-form" id="add-form"><label class="sr" for="add-code">Friend code</label>' +
    '<input id="add-code" class="text-in code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="K7M2QX">' +
    '<button type="submit" class="btn btn-gold">Add friend</button></form><p class="err" id="add-err" hidden></p>');
  var i = $('#add-code'); if (i) i.focus();

function addFriend(raw, onError) {
  var c = normCode(raw);
  if (!c) return onError('Friend codes have 6 letters and numbers, like K7M2QX.');
  if (state.me && c === state.me.code) return onError('That’s your own code. Ask your friend for theirs.');
  if (state.friends.indexOf(c) >= 0) return onError('You already follow this friend.');
  if (state.friends.length >= 50) return onError('You can follow up to 50 friends.');
  return apiFetch('/api/learners?codes=' + c).then(function (j) {
    var l = (j.learners || [])[0];
    if (!l) return onError('No learner has that code. Check it and try again.');
    friendData[c] = l; saveFriendCache();
    state.friends.push(c); save();
    friendsLoadedAt = friendsLoadedAt || Date.now(); friendStatus = 'ok';
    closeSheet(); renderFriends();
    toast(l.name + ' added. Send them your invite link so they can follow you too.');
  }).catch(function (e) { onError(friendError(e)); });
}

    '<div class="sheet-actions" style="justify-content:flex-start"><button type="button" class="btn btn-ghost" id="btn-del-profile">Delete my friend profile</button></div>');

function handleInvite() {
  var m = /[?&]add=([^&#]+)/.exec(location.search);

var OFFS = [0, 1, 1.45, 1, 0, -1, -1.45, -1];

function aboutHTML() {
  return '<p>This course teaches Coastal Kadazan (Boos Kadazan), spoken in Penampang, Papar and Membakut on Sabah’s west coast. It is close to Central Dusun, and the two are taught together in schools as standard Kadazandusun.</p>' +
    '<p>Spellings change from village to village. If your family says a word differently, go with your family.</p>' +
    '<p>The read-aloud voice is a Malay computer voice reading Kadazan spelling. Use it as a guide, not as a native speaker.</p>' +
    '<p>If you make a friend code, your display name, XP, streak, lessons done and this week’s XP are kept on the Boos Kadazan friends server, and anyone with your code can see them. You can delete your friend profile under Friends, Manage.</p>' +
    '<h3>Sources</h3><ol class="src">' +
    '<li><a href="https://omniglot.com/language/phrases/coastalkadazan.htm" target="_blank" rel="noopener">Useful phrases in Coastal Kadazan</a> on Omniglot, with phrases and recordings by Lesley Housten C Kibat and Dr Francis Paul.</li>' +
    '<li><a href="https://www.omniglot.com/language/numbers/coastalkadazan.htm" target="_blank" rel="noopener">Numbers in Coastal Kadazan</a> on Omniglot, compiled by Lesley Housten Kibat.</li>' +
    '<li><a href="https://www.omniglot.com/language/kinship/kadazandusun.htm" target="_blank" rel="noopener">Family words in Kadazandusun</a> on Omniglot, by Lesley Housten C Kibat.</li>' +
    '<li><a href="https://en.wikipedia.org/wiki/Coastal_Kadazan_language" target="_blank" rel="noopener">Coastal Kadazan language</a> on Wikipedia, for Kadazan and Dusun word pairs and sounds.</li>' +
    '<li><a href="https://en.wiktionary.org/wiki/Category:Coastal_Kadazan_lemmas" target="_blank" rel="noopener">Coastal Kadazan entries</a> on Wiktionary, for the food, body, colour, animal and nature units.</li>' +
    '<li><a href="https://acd.clld.org/languages/287" target="_blank" rel="noopener">Kadazan Dusun word list</a> in the Austronesian Comparative Dictionary, used to cross-check those units.</li>' +
    '</ol><p>Units 9 to 13 come from dictionary entries rather than a phrase book, so treat them as a starting vocabulary and check anything important with a speaker.</p><h3>Your progress</h3><p id="about-sync">' + (syncMode === 'account' ? 'Saved to your Claude account, so it follows you to other devices.' : 'Saved in this browser only.') + '</p>' +
    '<div class="sheet-actions" style="justify-content:flex-start"><button type="button" class="btn btn-ghost" id="btn-reset">Reset progress</button></div>';
}
$('#btn-about').addEventListener('click', function () { openSheet('About this course', aboutHTML()); });
$('#sheet-body').addEventListener('click', function (e) {
  if (e.target.closest('#btn-reset')) {
    $('#sheet-title').textContent = 'Reset all progress?';
    $('#sheet-body').innerHTML = '<p>This clears your XP, streak and finished lessons' + (syncMode === 'account' ? ' on every device' : '') + '. It cannot be undone.</p><div class="sheet-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="button" class="btn btn-bad" id="btn-reset-yes">Reset</button></div>';
    return;
  }
  if (e.target.closest('#btn-reset-yes')) {
    var keepMe = state.me, keepFriends = state.friends;
    state = blank(); state.me = keepMe; state.friends = keepFriends;
    save(); pushProgress(); renderHome(); closeSheet(); toast('Progress reset.');
    return;
  }
  if (e.target.closest('#btn-quit-yes')) { closeSheet(); closeLesson(); }
});

$('#btn-practice').addEventListener('click', function () {
  var steps = makePractice(state.done, state.weak);
  if (!steps) { toast('Finish your first lesson, then practise here.'); return; }
  run = newRun(null, steps);
  openLesson();
});

/* =====================================================================
   LESSON RUNNER
   ===================================================================== */
var run = null;
var GO = $('#l-go'), FOOT = $('#l-foot'), FB = $('#fb'), EX = $('#ex');
var PRAISE = ['Correct', 'Nicely done', 'Spot on', 'That’s it', 'Well done'];

function newRun(lesson, steps) {
  return { lesson: lesson, practice: !lesson, queue: steps, pos: 0, graded: 0, ok: 0, start: Date.now(), cur: null, action: null, finished: false };
}
function startLesson(lesson) {
  var replay = !!state.done[lesson.id];
  run = newRun(lesson, makeLesson(lesson, state.seen, replay));
  openLesson();
}
function openLesson() {
  $('#lesson').hidden = false;
  document.body.classList.add('locked');
  renderStep();
}
function closeLesson() {
  stopSpeech();
  run = null;
  $('#lesson').hidden = true;
  document.body.classList.remove('locked');
  hideTip();
  renderHome();
  refreshFriends();
  var c = $('.node.current');
  if (c) { c.scrollIntoView({ block: 'center', behavior: reduceMotion ? 'auto' : 'smooth' }); c.focus({ preventScroll: true }); }
}
$('#l-close').addEventListener('click', askQuit);
function askQuit() {
  if (!run) return;
  if (run.finished) { closeLesson(); return; }
  openSheet('Quit this lesson?', '<p>You will lose your progress in this lesson.</p><div class="sheet-actions"><button type="button" class="btn btn-ghost" data-close>Keep learning</button><button type="button" class="btn btn-bad" id="btn-quit-yes">Quit lesson</button></div>');
}

function setBar(f) {
  var p = Math.round(Math.max(0, Math.min(1, f)) * 100);
  $('#bar-fill').style.width = p + '%';
  $('#bar').setAttribute('aria-valuenow', String(p));
}
function hideGo() { GO.hidden = true; GO.disabled = true; run.action = null; }
function setGo(label, action, enabled, variant) {
  GO.hidden = false;
  GO.textContent = label;
  GO.disabled = !enabled;
  GO.className = 'btn btn-big btn-' + (variant || 'gold');
  run.action = action;
}
function setFoot(mode, title, detailHTML) {
  FOOT.setAttribute('data-state', mode);
  if (mode === 'idle') { FB.innerHTML = ''; return; }
  FB.innerHTML = '<div class="fb-icon">' + icon(mode === 'ok' ? 'i-check' : 'i-cross') + '</div><div><div class="fb-title">' + esc(title) + '</div>' + (detailHTML ? '<div class="fb-detail">' + detailHTML + '</div>' : '') + '</div>';
}
GO.addEventListener('click', function () { if (!GO.disabled && run && run.action) run.action(); });

function spkButtons(text) {
  var t = esc(text);
  return '<span class="say-btns"><button type="button" class="spk" data-say="' + t + '" aria-label="Hear it">' + icon('i-speaker') + '</button>' +
    '<button type="button" class="spk slow" data-say="' + t + '" data-slow="1" aria-label="Hear it slowly">Slow</button></span>';
}
function sayKZ(it, noGloss) {
  return '<div class="say"><svg class="say-mark" aria-hidden="true"><use href="#i-mark"/></svg><div class="say-bubble say-row"><div class="say-kz" lang="kzj">' + kzHTML(it.kz, noGloss) + '</div>' + spkButtons(it.kz) + '</div></div>';
}
function sayEN(it) {
  return '<div class="say"><svg class="say-mark" aria-hidden="true"><use href="#i-mark"/></svg><div class="say-bubble"><div class="say-en">“' + esc(it.en) + '”</div></div></div>';
}

function renderStep() {
  hideTip();
  var step = run.queue[run.pos];
  run.cur = { sel: null, picked: [], matched: 0, bad: 0, checked: false, first: null };
  setFoot('idle');
  setBar(run.pos / run.queue.length);
  $('#l-body').scrollTop = 0;
  var it = step.it, h = '';

  if (step.t === 'intro') {
    h = '<span class="pill">' + (isPhrase(it) ? 'New phrase' : 'New word') + '</span>' + sayKZ(it) +
      '<p class="intro-en">' + esc(it.en) + '</p>' +
      (it.note ? '<p class="intro-note">' + esc(it.note) + '</p>' : '') +
      (it.dusun ? '<span class="dusun">Central Dusun <b>' + esc(it.dusun) + '</b></span>' : '') +
      '<p class="hint">Tap a dotted word to see what it means.</p>';
    EX.innerHTML = h;
    setGo('Continue', next, true);
    GO.focus();
    autoSay(it.kz);
    return;
  }
  if (step.t === 'recog' || step.t === 'pick') {
    var kzOpts = step.t === 'pick';
    h = '<h2 class="ex-label">' + (kzOpts ? 'How do you say this in Kadazan?' : 'What does this mean?') + '</h2>' +
      (kzOpts ? sayEN(it) : sayKZ(it, !isPhrase(it))) +
      '<div class="opts" role="group" aria-label="Answers">' + step.options.map(function (o, i) {
        return '<button type="button" class="opt' + (kzOpts ? ' kz' : '') + '" data-i="' + i + '" aria-pressed="false"><span class="key">' + (i + 1) + '</span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>';
    EX.innerHTML = h;
    hideGo();
    FB.innerHTML = '<div class="fb-hint">Tap the answer you think is right.</div>';
    if (!kzOpts) autoSay(it.kz);
    return;
  }
  if (step.t === 'build') {
    h = '<h2 class="ex-label">Write this in Kadazan</h2>' + sayEN(it) +
      '<div class="zone" id="zone" aria-label="Your answer"></div>' +
      '<div class="bank" id="bank">' + step.tiles.map(function (t) {
        return '<button type="button" class="tile" data-t="' + t.i + '">' + esc(t.w) + '</button>';
      }).join('') + '</div>';
    EX.innerHTML = h;
    setGo('Check', check, false);
    return;
  }
  if (step.t === 'type') {
    h = '<h2 class="ex-label">Type this in Kadazan</h2>' + sayEN(it) +
      '<div class="type-wrap"><label class="sr" for="ans">Your answer in Kadazan</label>' +
      '<input id="ans" class="type-in" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type in Kadazan" lang="kzj">' +
      '<button type="button" class="glot" id="glot" aria-label="Insert glottal stop" title="Insert glottal stop">’</button></div>' +
      '<p class="hint">Use the ’ key for a glottal stop, as in iso’.</p>';
    EX.innerHTML = h;
    setGo('Check', check, false);
    var inp = $('#ans');
    inp.addEventListener('input', function () { GO.disabled = !inp.value.trim(); });
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); if (!GO.disabled) run.action(); } });
    $('#glot').addEventListener('click', function () {
      var a = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
      var b = inp.selectionEnd == null ? a : inp.selectionEnd;
      inp.setRangeText('’', a, b, 'end');
      inp.focus();
      GO.disabled = !inp.value.trim();
    });
    if (!window.matchMedia || !window.matchMedia('(pointer: coarse)').matches) inp.focus();
    return;
  }
  if (step.t === 'match') {
    var left = shuffle(step.items), right = shuffle(step.items);
    h = '<h2 class="ex-label">Tap the matching pairs</h2><div class="match">' +
      '<div class="mcol">' + left.map(function (x) { return '<button type="button" class="mbtn kz" data-side="k" data-id="' + x.id + '" aria-pressed="false">' + esc(x.kz) + '</button>'; }).join('') + '</div>' +
      '<div class="mcol">' + right.map(function (x) { return '<button type="button" class="mbtn" data-side="e" data-id="' + x.id + '" aria-pressed="false">' + esc(x.en) + '</button>'; }).join('') + '</div></div>';
    EX.innerHTML = h;
    setGo('Check', check, false);
  }
}

EX.addEventListener('click', function (e) {
  if (!run || run.cur.checked) return;
  var step = run.queue[run.pos];
  var o = e.target.closest('.opt');
  if (o) { selectOpt(+o.getAttribute('data-i')); return; }
  var t = e.target.closest('.tile');
  if (t && step.t === 'build') {
    if (t.hasAttribute('data-z')) {
      var zi = +t.getAttribute('data-z');
      run.cur.picked = run.cur.picked.filter(function (x) { return x !== zi; });
      var bt = $('.bank [data-t="' + zi + '"]'); if (bt) { bt.classList.remove('used'); bt.disabled = false; }
    } else if (!t.classList.contains('used')) {
      var ti = +t.getAttribute('data-t');
      run.cur.picked.push(ti);
      if (state.sound) speak(t.textContent);
      t.classList.add('used'); t.disabled = true;
    }
    renderZone(step);
    return;
  }
  var m = e.target.closest('.mbtn');
  if (m && step.t === 'match' && !m.classList.contains('matched')) matchTap(step, m);
});
/* Tapping an answer checks it straight away. */
function selectOpt(i) {
  var step = run.queue[run.pos];
  if (!step.options || i < 0 || i >= step.options.length || run.cur.checked) return;
  run.cur.sel = i;
  $$('.opt', EX).forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-i') === i)); });
  check();
}
function renderZone(step) {
  $('#zone').innerHTML = run.cur.picked.map(function (i) {
    var t = step.tiles.filter(function (x) { return x.i === i; })[0];
    return '<button type="button" class="tile" data-z="' + i + '">' + esc(t.w) + '</button>';
  }).join('');
  GO.disabled = run.cur.picked.length === 0;
}
function matchTap(step, m) {
  var side = m.getAttribute('data-side'), id = m.getAttribute('data-id');
  if (side === 'k' && state.sound) speak(m.textContent);
  var first = run.cur.first;
  if (!first || first.side === side) {
    $$('.mbtn[data-side="' + side + '"]', EX).forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
    if (first && first.el === m) { run.cur.first = null; return; }
    m.setAttribute('aria-pressed', 'true');
    run.cur.first = { side: side, id: id, el: m };
    return;
  }
  var a = first.el, b = m;
  a.setAttribute('aria-pressed', 'false');
  run.cur.first = null;
  if (first.id === id) {
    [a, b].forEach(function (x) { x.classList.add('matched'); x.disabled = true; });
    run.cur.matched++;
    if (run.cur.matched === step.items.length) finishMatch();
  } else {
    run.cur.bad++;
    [a, b].forEach(function (x) { x.classList.add('flash'); });
    setTimeout(function () { [a, b].forEach(function (x) { x.classList.remove('flash'); }); }, 450);
  }
}
function finishMatch() {
  var ok = run.cur.bad === 0;
  run.cur.checked = true;
  run.graded++; if (ok) run.ok++;
  setFoot('ok', ok ? pickOne(PRAISE) : 'All matched', ok ? 'Every pair on the first try.' : 'Those pairs will come back in other exercises.');
  setGo('Continue', next, true, 'ok');
  setBar((run.pos + 1) / run.queue.length);
  GO.focus();
  if (ok) autoNext(Promise.resolve());
}

function check() {
  var step = run.queue[run.pos], it = step.it, ok = false, title, detail = '';
  var kzSpan = function (s) { return '<span class="kz">' + esc(s) + '</span>'; };
  if (step.t === 'recog' || step.t === 'pick') {
    var answer = step.t === 'recog' ? it.en : it.kz;
    ok = step.options[run.cur.sel] === answer;
    $$('.opt', EX).forEach(function (b) {
      var i = +b.getAttribute('data-i');
      if (step.options[i] === answer) b.classList.add('is-right');
      else if (i === run.cur.sel) b.classList.add('is-wrong');
      b.disabled = true;
    });
    detail = ok ? kzSpan(it.kz) + ' means “' + esc(it.en) + '”'
      : 'Correct answer: ' + (step.t === 'recog' ? esc(it.en) : kzSpan(it.kz));
  } else if (step.t === 'build') {
    var said = run.cur.picked.map(function (i) { return step.tiles.filter(function (x) { return x.i === i; })[0].w; }).join(' ');
    ok = answersOf(it).some(function (a) { return strip(a) === strip(said); });
    $$('.tile', EX).forEach(function (b) { b.disabled = true; });
    detail = ok ? kzSpan(it.kz) + ' · ' + esc(it.en) : 'Correct answer: ' + kzSpan(it.kz);
  } else if (step.t === 'type') {
    var inp = $('#ans'), r = checkTyped(inp.value, answersOf(it));
    inp.disabled = true; $('#glot').disabled = true;
    ok = r.ok;
    if (r.kind === 'exact') detail = kzSpan(it.kz) + ' · ' + esc(it.en);
    else if (r.kind === 'glottal') detail = 'Mind the glottal stop: ' + kzSpan(r.a);
    else if (r.kind === 'typo') detail = 'Watch the spelling: ' + kzSpan(r.a);
    else detail = 'Correct answer: ' + kzSpan(it.kz);
  }
  title = ok ? pickOne(PRAISE) : 'Not quite';
  run.cur.checked = true;
  run.graded++;
  if (ok) {
    run.ok++;
    if (state.weak[it.id]) state.weak[it.id] = Math.max(0, state.weak[it.id] - 1);
  } else {
    state.weak[it.id] = (state.weak[it.id] || 0) + 1;
    if ((step.retry || 0) < 1) run.queue.push(regen(step));
  }
  setFoot(ok ? 'ok' : 'bad', title, detail);
  setGo('Continue', next, true, ok ? 'ok' : 'bad');
  setBar((run.pos + (ok ? 1 : 0)) / run.queue.length);
  GO.focus();
  var said = autoSay(it.kz);
  /* A right answer moves on by itself; a wrong one, or a typed answer with a spelling note, waits for Continue. */
  if (ok && !(step.t === 'type' && r.kind !== 'exact')) autoNext(said);
}

function autoNext(said) {
  var tok = run.adv = (run.adv || 0) + 1;
  Promise.all([delay(900), Promise.race([said, delay(2600)])]).then(function () {
    if (run && run.adv === tok && !run.finished && sheet.hidden) next();
  });
}

function next() {
  run.adv = (run.adv || 0) + 1;
  run.pos++;
  if (run.pos >= run.queue.length) finish(); else renderStep();
}

function finish() {
  var secs = Math.max(1, Math.round((Date.now() - run.start) / 1000));
  var acc = run.graded ? Math.round(100 * run.ok / run.graded) : 100;
  var perfect = run.ok === run.graded;
  var xp = run.practice ? 10 : 10 + (perfect ? 5 : 0);
  var hadToday = state.streak.last === today();
  if (run.lesson) {
    var d = state.done[run.lesson.id] || { n: 0, best: 0 };
    state.done[run.lesson.id] = { n: d.n + 1, best: Math.max(d.best, acc) };
    run.lesson.items.forEach(function (it) { state.seen[it.id] = 1; });
  }
  addXP(xp);
  save();
  pushProgress();
  run.finished = true;
  setBar(1);
  setFoot('idle');
  var mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, '0');
  EX.innerHTML = '<div class="done-wrap">' +
    '<svg class="done-mark" aria-hidden="true"><use href="#i-mark"/></svg>' +
    '<p class="done-kz" lang="kzj">Kounsikaan!</p>' +
    '<p class="done-en">Congratulations. ' + (run.lesson ? 'You finished “' + esc(run.lesson.name) + '”.' : 'Practice complete.') +
    (perfect ? ' No mistakes, so you earned 5 bonus XP.' : '') + '</p>' +
    '<div class="trio"><div><span class="t-l">XP</span><span class="t-v">+' + xp + '</span></div>' +
    '<div><span class="t-l">Accuracy</span><span class="t-v">' + acc + '%</span></div>' +
    '<div><span class="t-l">Time</span><span class="t-v">' + mm + ':' + ss + '</span></div></div>' +
    (!hadToday ? '<p class="streak-up"><svg aria-hidden="true"><use href="#i-flame"/></svg>' + streakNow() + '-day streak</p>' : '') +
    '</div>';
  setGo('Continue', closeLesson, true);
  GO.focus();
}

/* Keyboard: Enter checks or continues, 1 to 4 picks an answer, Escape quits. */
document.addEventListener('keydown', function (e) {
  if (!sheet.hidden) { if (e.key === 'Escape') closeSheet(); return; }
  if (!run) return;
  if (e.key === 'Escape') { askQuit(); return; }
  var tag = e.target && e.target.tagName;
  if (e.key === 'Enter') {
    if (tag === 'INPUT') return;
    if (tag === 'BUTTON' && e.target !== GO) return;
    if (e.target === GO) return;
    if (!GO.disabled && run.action) { e.preventDefault(); run.action(); }
    return;
  }
  if (tag === 'INPUT') return;
  var step = run.queue[run.pos];
  if (step && !run.cur.checked && step.options && /^[1-9]$/.test(e.key)) selectOpt(+e.key - 1);
});

/* =====================================================================
   BOOT
   ===================================================================== */
$('#l-sound').addEventListener('click', function () { setSound(!state.sound); });
initVoice();
updateSoundBtn();
renderHome();
handleInvite();
refreshFriends();
setTimeout(function () { initSync(0); }, 0);
})();
</script>
